<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diver Control CUN — Acceso</title>
    <style>
        :root {
            --dv-bg:          #04070a;
            --dv-bg-2:        #080e14;
            --dv-surface:     #0c151e;
            --dv-surface-2:   #122030;
            --dv-border:      #1f3040;
            --dv-aqua:        #2dd4bf;
            --dv-aqua-dark:   #0d9488;
            --dv-cyan:        #22d3ee;
            --dv-blue:        #38bdf8;
            --dv-green:       #22c55e;
            --dv-green-dark:  #15803d;
            --dv-green-bright:#4ade80;
            --dv-amber:       #f59e0b;
            --dv-alert:       #ef4444;
            --dv-text:        #e5f1f5;
            --dv-text-dim:    #7c95a6;
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background:
                radial-gradient(ellipse at 20% 10%, rgba(45,212,191,0.12), transparent 55%),
                radial-gradient(ellipse at 80% 90%, rgba(56,189,248,0.09), transparent 55%),
                var(--dv-bg);
            font-family: 'Segoe UI', 'Rajdhani', Tahoma, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            letter-spacing: 0.3px;
        }

        /* ── Card ─────────────────────────────────── */
        .auth-card {
            background: linear-gradient(170deg, var(--dv-surface), var(--dv-bg-2));
            border: 1px solid var(--dv-border);
            width: 100%;
            max-width: 440px;
            position: relative;
            clip-path: polygon(14px 0, 100% 0, 100% calc(100% - 14px), calc(100% - 14px) 100%, 0 100%, 0 14px);
            animation: fadeUp 0.35s ease both;
        }
        .auth-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 4px; height: 100%;
            background: linear-gradient(180deg, var(--dv-aqua), var(--dv-blue));
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(18px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ── Brand ────────────────────────────────── */
        .auth-brand {
            text-align: center;
            padding: 2rem 2rem 1.25rem;
            border-bottom: 1px solid var(--dv-border);
        }
        .brand-mark {
            display: inline-block;
            width: 52px; height: 52px;
            border: 2px solid var(--dv-aqua);
            transform: rotate(45deg);
            position: relative;
            margin-bottom: 1rem;
        }
        .brand-mark::before {
            content: '';
            position: absolute;
            inset: 8px;
            border: 1px solid var(--dv-blue);
        }
        .brand-mark::after {
            content: '';
            position: absolute;
            inset: 15px;
            background: var(--dv-aqua);
        }
        .brand-name {
            font-size: 1.55rem;
            font-weight: 700;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--dv-text);
        }
        .brand-sub {
            font-size: 0.72rem;
            letter-spacing: 2.5px;
            color: var(--dv-text-dim);
            text-transform: uppercase;
            margin-top: 0.15rem;
        }

        /* ── Tabs ─────────────────────────────────── */
        .auth-tabs {
            display: flex;
            border-bottom: 1px solid var(--dv-border);
        }
        .tab-btn {
            flex: 1;
            padding: 0.85rem;
            background: transparent;
            border: none;
            color: var(--dv-text-dim);
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
        }
        .tab-btn:hover { color: var(--dv-text); }
        .tab-btn.active {
            color: var(--dv-green);
            border-bottom-color: var(--dv-green);
            background: rgba(34,197,94,0.06);
        }

        /* ── Form panels ──────────────────────────── */
        .auth-body { padding: 1.75rem 2rem 2rem; }

        .tab-panel { display: none; }
        .tab-panel.active { display: block; }

        /* ── Fields ───────────────────────────────── */
        .field { margin-bottom: 1rem; }
        .field label {
            display: block;
            color: var(--dv-text-dim);
            font-size: 0.72rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 0.4rem;
        }
        .field input, .field select {
            width: 100%;
            padding: 0.72rem 0.9rem;
            background: var(--dv-bg);
            border: 1px solid var(--dv-border);
            color: var(--dv-text);
            font-size: 0.93rem;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            font-family: inherit;
        }
        .field input:focus, .field select:focus {
            border-color: var(--dv-green);
            box-shadow: 0 0 0 3px rgba(34,197,94,0.18);
        }
        .field input::placeholder { color: var(--dv-text-dim); opacity: 0.6; }

        .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }

        /* ── Divider ──────────────────────────────── */
        .divider {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin: 1.1rem 0;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--dv-border);
        }
        .divider span {
            color: var(--dv-text-dim);
            font-size: 0.7rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            white-space: nowrap;
        }

        /* ── Unitree section ──────────────────────── */
        .unitree-section {
            background: rgba(45,212,191,0.05);
            border: 1px dashed rgba(45,212,191,0.25);
            padding: 0.9rem 1rem;
            margin-bottom: 1rem;
        }
        .unitree-section .section-title {
            font-size: 0.7rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--dv-aqua);
            margin-bottom: 0.75rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .unitree-section .section-title::before {
            content: '🤖';
            font-size: 0.85rem;
        }
        .unitree-note {
            font-size: 0.75rem;
            color: var(--dv-text-dim);
            line-height: 1.5;
            margin-bottom: 0.75rem;
        }
        .unitree-note strong { color: var(--dv-aqua); }

        /* ── Submit btn ───────────────────────────── */
        .submit-btn {
            width: 100%;
            padding: 0.9rem;
            background: linear-gradient(90deg, var(--dv-green-dark), var(--dv-green));
            color: #fff;
            border: none;
            font-size: 0.88rem;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            cursor: pointer;
            clip-path: polygon(8px 0, 100% 0, calc(100% - 8px) 100%, 0 100%);
            transition: all 0.2s;
            margin-top: 0.5rem;
            position: relative;
        }
        .submit-btn:hover:not(:disabled) {
            background: linear-gradient(90deg, var(--dv-green), var(--dv-green-bright));
            transform: translateY(-1px);
            box-shadow: 0 0 22px rgba(34,197,94,0.4);
        }
        .submit-btn:disabled { opacity: 0.55; cursor: not-allowed; }

        /* ── Alert / status ───────────────────────── */
        .alert {
            padding: 0.65rem 0.9rem;
            font-size: 0.8rem;
            margin-bottom: 1rem;
            display: none;
            border-left: 3px solid;
        }
        .alert.show { display: block; }
        .alert.error   { color: #fca5a5; background: rgba(239,68,68,0.1); border-color: var(--dv-alert); }
        .alert.success { color: #86efac; background: rgba(34,197,94,0.1); border-color: var(--dv-green); }
        .alert.info    { color: #7dd3fc; background: rgba(56,189,248,0.1); border-color: var(--dv-blue); }

        /* ── Unitree status chip ──────────────────── */
        .unitree-status {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.73rem;
            letter-spacing: 1px;
            padding: 0.3rem 0.65rem;
            border: 1px solid;
            margin-top: 0.5rem;
        }
        .unitree-status.ok     { color: var(--dv-green); border-color: rgba(34,197,94,0.35); background: rgba(34,197,94,0.08); }
        .unitree-status.fail   { color: var(--dv-alert); border-color: rgba(239,68,68,0.35);  background: rgba(239,68,68,0.08); }
        .unitree-status.checking { color: var(--dv-amber); border-color: rgba(245,158,11,0.35); background: rgba(245,158,11,0.08); }
        .unitree-status.dot::before { content: '●'; font-size: 0.55rem; }

        /* ── Spinner ──────────────────────────────── */
        .spinner {
            display: none;
            width: 14px; height: 14px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            vertical-align: middle;
            margin-right: 0.4rem;
        }
        .submit-btn.loading .spinner { display: inline-block; }
        .submit-btn.loading .btn-label { opacity: 0.7; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── Footer hint ──────────────────────────── */
        .auth-footer {
            text-align: center;
            padding: 0.9rem 2rem 1.5rem;
            border-top: 1px dashed var(--dv-border);
            color: var(--dv-text-dim);
            font-size: 0.73rem;
            letter-spacing: 0.5px;
        }
        .auth-footer a {
            color: var(--dv-aqua);
            text-decoration: none;
        }

        /* ── Responsive ───────────────────────────── */
        @media (max-width: 480px) {
            .auth-card { clip-path: none; }
            .auth-body { padding: 1.4rem 1.25rem 1.75rem; }
            .field-row { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="auth-card">

    <!-- Brand -->
    <div class="auth-brand">
        <div class="brand-mark"></div>
        <div class="brand-name">Daiver</div>
        <div class="brand-sub">Control CUN · Unitree Go2</div>
    </div>

    <!-- Tabs -->
    <div class="auth-tabs">
        <button class="tab-btn active" data-tab="login">Ingresar</button>
        <button class="tab-btn"        data-tab="register">Registrarse</button>
    </div>

    <div class="auth-body">

        <!-- ══════════ TAB: LOGIN ══════════ -->
        <div class="tab-panel active" id="panel-login">

            <div class="alert error" id="login-error"></div>

            <form id="login-form" autocomplete="off">
                <div class="field">
                    <label for="l-user">Usuario</label>
                    <input type="text" id="l-user" name="user" required placeholder="admin" autocomplete="off">
                </div>
                <div class="field">
                    <label for="l-pass">Contraseña</label>
                    <input type="password" id="l-pass" name="pass" required placeholder="••••••••">
                </div>
                <button type="submit" class="submit-btn" id="btn-login">
                    <span class="spinner"></span>
                    <span class="btn-label">Ingresar</span>
                </button>
            </form>

        </div><!-- /panel-login -->

        <!-- ══════════ TAB: REGISTER ══════════ -->
        <div class="tab-panel" id="panel-register">

            <div class="alert error"   id="reg-error"></div>
            <div class="alert success" id="reg-success"></div>

            <form id="register-form" autocomplete="off">

                <!-- Datos locales -->
                <div class="field-row">
                    <div class="field">
                        <label for="r-name">Nombre completo</label>
                        <input type="text" id="r-name" required placeholder="Diego Fernando">
                    </div>
                    <div class="field">
                        <label for="r-inst">Institución</label>
                        <input type="text" id="r-inst" placeholder="cun.edu.co">
                    </div>
                </div>

                <div class="field">
                    <label for="r-email">Correo institucional</label>
                    <input type="email" id="r-email" required placeholder="usuario@cun.edu.co">
                </div>

                <div class="field-row">
                    <div class="field">
                        <label for="r-user">Usuario de acceso</label>
                        <input type="text" id="r-user" required minlength="3" placeholder="mi_usuario" autocomplete="off">
                    </div>
                    <div class="field">
                        <label for="r-pass">Contraseña</label>
                        <input type="password" id="r-pass" required minlength="4" placeholder="mínimo 4 chars">
                    </div>
                </div>

                <!-- Cuenta Unitree Cloud -->
                <div class="divider"><span>Cuenta Unitree Cloud</span></div>

                <div class="unitree-section">
                    <div class="section-title">Vinculación con Unitree</div>
                    <p class="unitree-note">
                        Ingresa las credenciales de tu cuenta <strong>Unitree</strong>.
                        El sistema verificará la cuenta, obtendrá los robots vinculados
                        y los registrará automáticamente. <strong>No necesitas la app oficial.</strong>
                    </p>

                    <div class="field">
                        <label for="r-uemail">Email de Unitree Cloud</label>
                        <input type="email" id="r-uemail" placeholder="cuenta@gmail.com">
                    </div>
                    <div class="field">
                        <label for="r-upass">Contraseña Unitree</label>
                        <input type="password" id="r-upass" placeholder="••••••••">
                    </div>

                    <div id="unitree-check-status"></div>
                </div>

                <button type="submit" class="submit-btn" id="btn-register">
                    <span class="spinner"></span>
                    <span class="btn-label">Crear cuenta</span>
                </button>

            </form>
        </div><!-- /panel-register -->

    </div><!-- /auth-body -->

    <div class="auth-footer">
        Laboratorio 2 · CUN · <a href="/" onclick="return false;">Diver Control</a>
    </div>
</div>

<script>
    const USERS_KEY   = 'dv_users';
    const SESSION_KEY = 'dv_session';

    function loadUsers() {
        const ROBOT_DATA = { sn: 'B42D1000PAHBJ3K5', name: 'Go2 Air', key: 'cf083d2536fb3c9b02966c1c584daecb' };
        const ADMIN_DEFAULT = { username: 'admin', password: 'admin123', role: 'admin', fixed: true, fullName: 'Admin', institution: 'CUN', email: 'divergencyai@gmail.com', unitreeEmail: 'divergencyai@gmail.com', unitreePassword: 'Diver.123', unitreeRobots: [ROBOT_DATA] };
        const DIVERGENCY_DEFAULT = { username: 'divergency', password: 'admin123', role: 'operator', fixed: true, fullName: 'Divergency AI', institution: 'CUN', email: 'divergencyai@gmail.com', unitreeEmail: 'divergencyai@gmail.com', unitreePassword: 'Diver.123', unitreeRobots: [ROBOT_DATA] };
        try {
            const raw = localStorage.getItem(USERS_KEY);
            if (raw) {
                const users = JSON.parse(raw);
                const adm = users.find(u => u.username === 'admin');
                if (adm && !adm.unitreeRobots) Object.assign(adm, ADMIN_DEFAULT);
                if (!users.find(u => u.username === 'divergency')) users.push(DIVERGENCY_DEFAULT);
                localStorage.setItem(USERS_KEY, JSON.stringify(users));
                return users;
            }
        } catch (e) { /* ignore */ }
        const defaults = [ADMIN_DEFAULT, DIVERGENCY_DEFAULT];
        localStorage.setItem(USERS_KEY, JSON.stringify(defaults));
        return defaults;
    }

    function saveUsers(users) {
        localStorage.setItem(USERS_KEY, JSON.stringify(users));
    }

    function currentUser() {
        try {
            const raw = sessionStorage.getItem(SESSION_KEY);
            return raw ? JSON.parse(raw) : null;
        } catch (e) { return null; }
    }

    function setCurrentUser(u) {
        if (u) sessionStorage.setItem(SESSION_KEY, JSON.stringify(u));
        else    sessionStorage.removeItem(SESSION_KEY);
    }

    // Asegurar que los usuarios por defecto existen en localStorage
    loadUsers();

    // Si ya hay sesión activa, ir directo al dashboard
    if (currentUser()) window.location.href = '/';

    // ── Tabs ──────────────────────────────────────────────────────
    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            const tab = btn.dataset.tab;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById('panel-' + tab).classList.add('active');
        });
    });

    function showAlert(id, msg, type) {
        const el = document.getElementById(id);
        if (!el) return;
        el.textContent  = msg;
        el.className    = 'alert show ' + type;
    }
    function hideAlert(id) {
        const el = document.getElementById(id);
        if (el) { el.className = 'alert'; el.textContent = ''; }
    }
    function setLoading(btnId, on) {
        const btn = document.getElementById(btnId);
        if (!btn) return;
        btn.disabled = on;
        btn.classList.toggle('loading', on);
    }

    // ── Login ──────────────────────────────────────────────────────
    document.getElementById('login-form').addEventListener('submit', function (e) {
        e.preventDefault();
        hideAlert('login-error');
        const user   = document.getElementById('l-user').value.trim();
        const pass   = document.getElementById('l-pass').value;
        const users  = loadUsers();
        const found  = users.find(u => (u.username === user || u.email === user) && u.password === pass);
        if (found) {
            setCurrentUser({ username: found.username, role: found.role, fullName: found.fullName || found.username, institution: found.institution || '', email: found.email || '' });
            window.location.href = '/';
        } else {
            showAlert('login-error', 'Usuario o contraseña incorrectos', 'error');
        }
    });

    // ── Registro ───────────────────────────────────────────────────
    document.getElementById('register-form').addEventListener('submit', async function (e) {
        e.preventDefault();
        hideAlert('reg-error');
        hideAlert('reg-success');

        const fullName   = document.getElementById('r-name').value.trim();
        const institution= document.getElementById('r-inst').value.trim();
        const email      = document.getElementById('r-email').value.trim();
        const username   = document.getElementById('r-user').value.trim();
        const password   = document.getElementById('r-pass').value;
        const uEmail     = document.getElementById('r-uemail').value.trim();
        const uPass      = document.getElementById('r-upass').value;

        const users = loadUsers();
        if (users.some(u => u.username === username)) {
            showAlert('reg-error', `El usuario "${username}" ya existe.`, 'error');
            return;
        }

        setLoading('btn-register', true);

        let robots    = [];
        let unitreeOk = false;

        // Verificar cuenta Unitree si se proporcionó
        if (uEmail && uPass) {
            const statusEl = document.getElementById('unitree-check-status');
            statusEl.innerHTML = '<span class="unitree-status checking dot"> Verificando cuenta Unitree...</span>';
            try {
                const resp = await fetch('/api/unitree/validate', {
                    method:  'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body:    JSON.stringify({ email: uEmail, password: uPass }),
                });
                const data = await resp.json();
                if (data.ok) {
                    robots    = data.robots || [];
                    unitreeOk = true;
                    const names = robots.map(r => r.sn).join(', ') || 'ninguno';
                    statusEl.innerHTML = `<span class="unitree-status ok dot"> Cuenta verificada · ${robots.length} robot(s): ${names}</span>`;
                } else {
                    statusEl.innerHTML = `<span class="unitree-status fail dot"> ${data.error || 'Error al verificar'}</span>`;
                }
            } catch (err) {
                statusEl.innerHTML = '<span class="unitree-status fail dot"> No se pudo contactar el servidor</span>';
            }
        }

        // Guardar usuario localmente
        const newUser = {
            username,
            password,
            role:        'operador',
            fixed:       false,
            fullName,
            institution,
            email,
            unitreeEmail:    uEmail    || null,
            unitreePassword: uPass     || null,
            unitreeRobots:   robots,
        };
        users.push(newUser);
        saveUsers(users);

        // Auto-login
        setCurrentUser({ username, role: 'operador', fullName, institution, email, robots });
        setLoading('btn-register', false);

        showAlert('reg-success', `Cuenta creada. ${unitreeOk ? `Robots Unitree vinculados: ${robots.length}.` : ''} Redirigiendo...`, 'success');
        setTimeout(() => { window.location.href = '/'; }, 1500);
    });
</script>
</body>
</html>
