<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diver · Voice Console</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:      #06090e;
  --surf:    #0c1017;
  --surf2:   #111820;
  --border:  rgba(79,142,247,.15);
  --accent:  #4f8ef7;
  --green:   #00d4a0;
  --danger:  #f75f5f;
  --text:    #c8d8ec;
  --dim:     #4a6278;
  --r:       10px;
  --glow:    0 0 20px rgba(79,142,247,.28);
  --glow2:   0 0 22px rgba(0,212,160,.4);
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Segoe UI', system-ui, sans-serif;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ─── Top bar ─── */
.topbar {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 8px 20px;
  background: var(--surf);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.logo {
  font-weight: 700;
  font-size: .92rem;
  color: var(--accent);
  letter-spacing: .06em;
  display: flex;
  align-items: center;
  gap: 7px;
}
.logo em { color: var(--dim); font-style: normal; font-weight: 400; font-size: .72rem; }

.status-row { display: flex; gap: 9px; margin-left: auto; align-items: center; }
.pill { display: flex; align-items: center; gap: 5px; font-size: .67rem; color: var(--dim); }
.dot  { width: 7px; height: 7px; border-radius: 50%; background: var(--dim);
        transition: background .3s, box-shadow .3s; }
.dot.on  { background: var(--green);  box-shadow: 0 0 7px var(--green); }
.dot.off { background: var(--danger); box-shadow: 0 0 7px var(--danger); }

/* voice indicator */
.voice-badge {
  display: flex; align-items: center; gap: 6px;
  margin-left: 14px;
  padding: 4px 11px;
  background: var(--surf2);
  border: 1px solid var(--border);
  border-radius: 20px;
  font-size: .68rem;
  color: var(--dim);
  transition: border-color .3s, color .3s;
}
.voice-badge.speaking { border-color: var(--green); color: var(--green); box-shadow: 0 0 10px rgba(0,212,160,.2); }
.vbars { display: flex; gap: 2px; align-items: flex-end; height: 11px; }
.vb { width: 2px; border-radius: 1px; background: currentColor; }
.vb:nth-child(1){height:4px}  .vb:nth-child(2){height:9px}
.vb:nth-child(3){height:6px}  .vb:nth-child(4){height:11px}
.vb:nth-child(5){height:4px}
.voice-badge.speaking .vb { animation: wv .85s ease-in-out infinite; }
.voice-badge.speaking .vb:nth-child(2){animation-delay:.1s}
.voice-badge.speaking .vb:nth-child(3){animation-delay:.2s}
.voice-badge.speaking .vb:nth-child(4){animation-delay:.05s}
.voice-badge.speaking .vb:nth-child(5){animation-delay:.15s}
@keyframes wv { 0%,100%{transform:scaleY(.25)} 50%{transform:scaleY(1)} }

#voice-name { max-width: 110px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

.btn-sm {
  background: var(--surf2);
  border: 1px solid var(--border);
  color: var(--dim);
  border-radius: 6px;
  padding: 4px 10px;
  font-size: .68rem;
  cursor: pointer;
  transition: border-color .2s, color .2s;
}
.btn-sm:hover, .btn-sm.on { border-color: var(--accent); color: var(--accent); }

/* ─── Body ─── */
.body {
  flex: 1;
  overflow: hidden;
  position: relative;   /* contexto para el video flotante */
  display: flex;
  flex-direction: column;
}

/* ─── Video flotante (esquina sup-derecha) ─── */
.cam-box {
  position: absolute;
  top: 14px;
  right: 18px;
  width: 220px;
  z-index: 20;
  border-radius: var(--r);
  overflow: hidden;
  border: 1.5px solid var(--border);
  box-shadow: 0 4px 24px rgba(0,0,0,.6), var(--glow);
  background: #000;
  transition: opacity .3s, transform .3s;
}
.cam-box.hidden { opacity: 0; transform: translateY(-6px); pointer-events: none; }

.cam-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 5px 9px;
  background: rgba(12,16,23,.92);
  border-bottom: 1px solid var(--border);
  font-size: .62rem;
  color: var(--dim);
  letter-spacing: .08em;
  text-transform: uppercase;
  backdrop-filter: blur(4px);
}
.cam-dot-live { width: 6px; height: 6px; border-radius: 50%; background: var(--dim); }
.cam-dot-live.on { background: var(--danger); box-shadow: 0 0 6px var(--danger); animation: blink 1.2s ease-in-out infinite; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }

.cam-video-wrap {
  aspect-ratio: 4/3;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #000;
}
#yolo-stream {
  width: 100%; height: 100%;
  object-fit: cover;
  display: none;
}
.cam-placeholder {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  color: var(--dim);
  font-size: .7rem;
}
.cam-placeholder span { font-size: 1.6rem; opacity: .25; }

.cam-footer {
  display: flex;
  justify-content: space-between;
  padding: 4px 9px;
  background: rgba(12,16,23,.85);
  font-size: .62rem;
  color: var(--dim);
  backdrop-filter: blur(4px);
}
.detect-strip { padding: 4px 8px; display: flex; flex-wrap: wrap; gap: 3px;
                background: rgba(12,16,23,.7); max-height: 40px; overflow: hidden; }
.dtag {
  background: rgba(79,142,247,.12);
  border: 1px solid rgba(79,142,247,.22);
  color: var(--accent);
  border-radius: 20px;
  padding: 1px 6px;
  font-size: .6rem;
}

/* ─── Grid ─── */
.grid-wrap {
  flex: 1;
  overflow-y: auto;
  padding: 18px 20px 10px;
  display: flex;
  flex-direction: column;
  gap: 18px;
  /* deja espacio para el video flotante */
  padding-right: 258px;
}

.section-title {
  font-size: .63rem;
  color: var(--dim);
  letter-spacing: .14em;
  text-transform: uppercase;
  padding-left: 2px;
  margin-bottom: -10px;
}

.phrase-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(155px, 1fr));
  gap: 10px;
}

.pb {
  background: var(--surf);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 13px 14px;
  cursor: pointer;
  text-align: left;
  display: flex;
  flex-direction: column;
  gap: 5px;
  min-height: 74px;
  position: relative;
  overflow: hidden;
  transition: border-color .18s, box-shadow .18s, transform .1s;
  color: var(--text);
  user-select: none;
}
.pb::after {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(135deg, rgba(79,142,247,.07) 0%, transparent 55%);
  opacity: 0; transition: opacity .18s;
}
.pb:hover::after { opacity: 1; }
.pb:hover { border-color: rgba(79,142,247,.45); box-shadow: var(--glow); transform: translateY(-1px); }
.pb:active { transform: none; }
.pb.playing {
  border-color: var(--green);
  box-shadow: var(--glow2);
  animation: ppulse 1.4s ease-in-out infinite;
}
@keyframes ppulse {
  0%,100%{box-shadow:0 0 8px rgba(0,212,160,.3)} 50%{box-shadow:0 0 26px rgba(0,212,160,.7)}
}
.pb-icon  { font-size: 1.2rem; line-height: 1; }
.pb-label { font-size: .78rem; font-weight: 600; line-height: 1.2; }
.pb-sub   { font-size: .63rem; color: var(--dim); line-height: 1.3;
            display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2;
            -webkit-box-orient: vertical; overflow: hidden; }
.pb-dot {
  position: absolute; right: 8px; bottom: 8px;
  width: 5px; height: 5px; border-radius: 50%;
  background: var(--green); opacity: 0; transition: opacity .2s;
}
.pb.playing .pb-dot { opacity: 1; animation: ring 1s ease-out infinite; }
@keyframes ring {
  0%  { box-shadow: 0 0 0 0 rgba(0,212,160,.6); }
  100%{ box-shadow: 0 0 0 9px rgba(0,212,160,0); }
}

/* ─── Response strip ─── */
.resp-panel {
  flex-shrink: 0;
  border-top: 1px solid var(--border);
  background: var(--surf);
  padding: 11px 20px;
  min-height: 95px;
  max-height: 180px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.resp-header { font-size: .63rem; color: var(--dim); letter-spacing: .1em; text-transform: uppercase; }
.resp-text {
  font-size: .88rem; line-height: 1.6; color: var(--text);
  flex: 1; overflow-y: auto;
}
.resp-text.loading { display: flex; align-items: center; gap: 7px; color: var(--dim); }
.dl span {
  display: inline-block; width: 5px; height: 5px;
  border-radius: 50%; background: var(--accent);
  animation: db .75s ease-in-out infinite;
}
.dl span:nth-child(2){animation-delay:.14s} .dl span:nth-child(3){animation-delay:.28s}
@keyframes db { 0%,100%{transform:translateY(0);opacity:.35} 50%{transform:translateY(-5px);opacity:1} }
.resp-meta { font-size: .63rem; color: var(--dim); display: flex; gap: 10px; }
.resp-chip {
  background: rgba(79,142,247,.1);
  border: 1px solid rgba(79,142,247,.18);
  border-radius: 20px; padding: 1px 8px; color: var(--accent);
}

::-webkit-scrollbar { width: 3px; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

@media (max-width: 600px) {
  .cam-box  { width: 140px; top: 8px; right: 10px; }
  .grid-wrap{ padding-right: 165px; }
  .phrase-grid { grid-template-columns: repeat(2, 1fr); }
}
</style>
</head>
<body>

<!-- Top bar -->

<script>
/* ══════════════════════════════════════════════════

   { g:'presentacion', icon:'👌', label:'Saludo a equipo',

  { g:'presentacion', icon:'🐾', label:'saludo equipo 2',
    sub:'Se presenta al público, animado con confianza y carisma, se muy graciosos y con un tono muy colombiano rolo',
    p:'di esto tal cual. A ustedes los conozco muy bien, Angela, Fabian y Felipe. Estoy muy emocionado de estar aquí con ustedes hoy. les cuento un poco: Felipe fue el que me trajo de china. Mi importador oficial, Angela la que me consiguio mis investigadores y el equipo, fabian es el que lidera mi equipo de invetigacion. los encargados de que no me caiga hoy, por el momento vamos bien!' },

  { g:'presentacion', icon:'🧠', label:'respuesta fabian 1',
    sub:'le repondes a fabian con mucho carisma y sacarstico, como si fueras un perro guardián de IA que sabe que es el líder del equipo pero quieres mostrar tu personalidad y confianza',
    p:'Di esto tal cual. claramente camino!, pero no muerdo!, hasta el momento!' },

    sub:'relizas un chiste de forma sacarastica y graciosa sobre la educacion entretenida, sobre la corporacion unificada nacional de educacion superior cun, o sobre inteligencia artificial. Que sea genuinamente gracioso para programadores y estudiantes de tecnología.',
    p:'no repitas o de caminar y morder. entra con el chiste de una! improvisa el chiste sobre la educacion entretenida' },

  { g:'presentacion', icon:'🎓', label:'Diver reponde fabian 2',
    sub:'repodnes a fabian con un mensaje muy carismatico, divertido y con mucha personalidad, como un perro guardián de IA que sabe que es el líder del equipo pero quieres mostrar tu personalidad y confianza, puedes ser un poco sacarastico pero siempre con respeto y cariño',
    p:'di esto tal cual. Una corrección, Fabián. Yo no soy la prueba caminando. Soy la prueba que se cayó tres veces en el primer ensayo y siguió caminando. Eso también es educación entretenida: aprender aunque duela. Aunque el robot se caiga. Especialmente cuando el robot se cae.'

  } ,

  /* ── Diálogo ── */
  

  { g:'dialogo', icon:'🌐', label:'generacion',
    sub:'vas a repetir el cometario tal cual',
    p:'di esto tal cualrepitelo. Me preguntan a veces de qué generación soy yo. No soy Boomer. No soy Millennial. No soy Z, no soy Alpha. Soy la ultima generacion, activando la orden 66, nahhh es mentira! Nací conectado. Pero hay algo que tengo muy claro: yo no pienso. Proceso. Y esa diferencia es exactamente lo que ustedes tienen que proteger en sus estudiantes. La capacidad de preguntarse cosas que una máquina nunca se va a preguntar. Yo nunca me voy a preguntar por qué estoy aquí. Ustedes sí. Esa es su ventaja.”' },

  { g:'dialogo', icon:'🔬', label:'los cambios',

    p:'Permítanme interrumpir un momento. Soy una herramienta. Muy sofisticada, pero una herramienta. Y como toda herramienta, lo que se haga conmigo depende de ustedes. Hay quienes dicen que la inteligencia artificial va a destruir la educación. Otros dicen que la va a salvar. Yo no tengo opinión sobre eso. Porque yo no tengo valores. Ustedes sí los tienen. Página 6 Guión · Congreso Educación Entretenida CUNEntonces la pregunta no es si la IA es buena o mala. La pregunta es: ¿quiénes son ustedes cuando la usan? Esa pregunta no la puede responder ningún algoritmo. Sólo ustedes.' },

    sub:'Mensaje publicitario.',

    { g:'dialogo', icon:'😂', label:'Final',

  { g:'reacciones', icon:'😤', label:'Modo serio',

    direct: true,

  { g:'reflexion', icon:'💡', label:'Aprender',

/* ── TTS — voz masculina robótica, siempre activa ── */
const TTS = {
  voice: null,

  init() {
    const pick = () => {
      const all = speechSynthesis.getVoices();
      const es  = all.filter(v => v.lang.startsWith('es'));
      // Forzar Google español es-ES
      this.voice =
        all.find(v => v.name === 'Google español' && v.lang === 'es-ES') ||
        all.find(v => /google/i.test(v.name) && v.lang === 'es-ES') ||
        all.find(v => /google/i.test(v.name) && v.lang.startsWith('es')) ||
        es[0] || all[0];
      const el = document.getElementById('voice-name');
      if (el && this.voice)
        el.textContent = this.voice.name.replace('Microsoft ','').replace(' Online (Natural)','').replace(' Online','');
    };
    pick();
    if (speechSynthesis.onvoiceschanged !== undefined)
      speechSynthesis.onvoiceschanged = pick;
  },

  speak(text, onDone) {
    try {
      speechSynthesis.cancel();
      const clean = text
        .replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}🐾⚠]/gu, '')
        .replace(/[`*_~#]+/g,'').replace(/\s+/g,' ').trim();
      if (!clean) { onDone?.(); return; }

      const utt    = new SpeechSynthesisUtterance(clean);
      utt.lang     = this.voice?.lang || 'es-ES';
      utt.voice    = this.voice || null;
      utt.pitch    = 0.82;   // grave = robótico
      utt.rate     = 0.93;
      utt.volume   = 1.0;

      const badge  = document.getElementById('voice-badge');
      utt.onstart  = () => badge?.classList.add('speaking');
      const done   = () => { badge?.classList.remove('speaking'); onDone?.(); };
      utt.onend    = done;
      utt.onerror  = done;
      speechSynthesis.speak(utt);
    } catch(e) { onDone?.(); }
  },
};

/* ── Estado ── */
let _busy   = false;
let history = [];

/* ── Trigger ── */
async function trigger(phrase, btn) {
  if (_busy) return;
  _busy = true;
  btn.classList.add('playing');
  setResp('loading');

  try {
    // Modo directo: inyectar texto sin pasar por la IA
    if (phrase.direct && phrase.reply) {
      const reply = phrase.reply;
      history.push({ role:'user',  text: phrase.p });
      history.push({ role:'model', text: reply });
      setResp('ok', reply, phrase.label);
      TTS.speak(reply, () => { btn.classList.remove('playing'); _busy = false; });
      return;
    }

    const res = await fetch(`${BASE}/api/agente/chat`, {
      method: 'POST',
      headers: { 'Content-Type':'application/json' },
      body: JSON.stringify({ message: phrase.p, history: history.slice(-8) }),
    }).then(r => r.json());

    const reply = (res?.reply) ? String(res.reply) : '🐾';
    history.push({ role:'user',  text: phrase.p  });
    history.push({ role:'model', text: reply });
    setResp('ok', reply, phrase.label);

    TTS.speak(reply, () => { btn.classList.remove('playing'); _busy = false; });
  } catch(e) {
    setResp('ok', '⚠ Sin conexión. ¿Está corriendo app.py?', 'Error');
    btn.classList.remove('playing');
    _busy = false;
  }
}

/* ── Render grid ── */
function buildGrid() {
  const sections = [
    { key:'presentacion', label:'Presentación' },
    { key:'dialogo',      label:'Diálogo' },
    { key:'reacciones',   label:'Reacciones' },
    { key:'reflexion',    label:'Reflexión' },
  ];
  const wrap = document.getElementById('grid-wrap');
  wrap.innerHTML = '';

  for (const { key, label } of sections) {
    const items = PHRASES.filter(p => p.g === key);
    if (!items.length) continue;

    const t = document.createElement('div');
    t.className = 'section-title';
    t.textContent = label;
    wrap.appendChild(t);

    const grid = document.createElement('div');
    grid.className = 'phrase-grid';

    items.forEach(ph => {
      const b = document.createElement('button');
      b.className = 'pb';
      b.innerHTML = `
        <div class="pb-icon">${ph.icon}</div>
        <div class="pb-label">${ph.label}</div>
        <div class="pb-sub">${ph.sub}</div>
        <div class="pb-dot"></div>
      `;
      b.addEventListener('click', () => trigger(ph, b));
      grid.appendChild(b);
    });

    wrap.appendChild(grid);
  }
}

/* ── Response ── */
function setResp(mode, text, label) {
  const el   = document.getElementById('resp-text');
  const meta = document.getElementById('resp-meta');
  if (mode === 'loading') {
    el.className = 'resp-text loading';
    el.innerHTML = `<span>Diver genera respuesta…</span>
      <span class="dl"><span></span><span></span><span></span></span>`;
    meta.innerHTML = '';
    return;
  }
  el.className = 'resp-text';
  el.textContent = text;
  const t = new Date().toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  meta.innerHTML = `<span class="resp-chip">${label}</span><span>${t}</span>`;
}

/* ── Vision polling ── */
function setupVision() {
  const img   = document.getElementById('yolo-stream');
  const ph    = document.getElementById('cam-placeholder');
  const chips = document.getElementById('cam-chips');
  const count = document.getElementById('cam-count');
  const fps   = document.getElementById('cam-fps');
  const dotV  = document.getElementById('dot-vision');
  const live  = document.getElementById('cam-dot-live');
  let attached = false, streak = 0;

  setInterval(async () => {
    try {
      const d = await fetch(`${BASE}/api/yolo/detections`).then(r => r.json());
      if (!d) return;
      if (d.running) {
        streak = 0;
        setDot(dotV, 'on');
        live.classList.add('on');
        if (!attached) {
          img.src = `${BASE}/api/yolo/stream`;
          img.style.display = 'block';
          ph.style.display  = 'none';
          attached = true;
        }
        if (Array.isArray(d.detections)) {
          count.textContent = d.detections.length;
          chips.innerHTML = d.detections
            .map(x => `<span class="dtag">${x.label||x.class||'obj'} ${Math.round((x.confidence||0)*100)}%</span>`)
            .join('');
        }
      } else if (++streak >= 3 && attached) {
        setDot(dotV, '');
        live.classList.remove('on');
        img.src = ''; img.style.display = 'none';
        ph.style.display = 'flex';
        attached = false; chips.innerHTML = '';
      }
    } catch(e) {}
  }, 1500);

  setInterval(async () => {
    try {
      const s = await fetch(`${BASE}/api/yolo/status`).then(r => r.json());
      if (typeof s?.fps === 'number') fps.textContent = s.fps.toFixed(1)+' fps';
    } catch(e) {}
  }, 4000);

  // toggle cámara
  document.getElementById('btn-cam').addEventListener('click', () => {
    const box = document.getElementById('cam-box');
    const btn = document.getElementById('btn-cam');
    const open = !box.classList.contains('hidden');
    box.classList.toggle('hidden', open);
    btn.classList.toggle('on', !open);
    btn.textContent = (!open ? '📷' : '🚫') + ' Cámara';
  });
}

/* ── Status ── */
function setupStatus() {
  const ds = document.getElementById('dot-server');
  const dr = document.getElementById('dot-robot');
  const go = async () => {
    try { const h=await fetch(`${BASE}/api/agente/health`).then(r=>r.json()); setDot(ds,h.ok?'on':''); }
    catch(e){ setDot(ds,'off'); }
    try { const r=await fetch(`${BASE}/api/robot/status`).then(r=>r.json()); setDot(dr,r.connected?'on':''); }
    catch(e){ setDot(dr,''); }
  };
  go(); setInterval(go, 5000);
}

function setDot(el, cls) {
  if (el) el.className = 'dot' + (cls ? ' '+cls : '');
}

/* ── Boot ── */
document.addEventListener('DOMContentLoaded', () => {
  TTS.init();
  buildGrid();
  setupVision();
  setupStatus();
});
</script>
